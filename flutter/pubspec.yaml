name: eduaccesible
description: EduAccesible - La información también se escucha
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  flutter_tts: ^4.0.2
  speech_to_text: ^7.5.0
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_object_detection: ^0.17.1
  path_provider: ^2.1.5
  hand_landmarker: ^3.0.1
  google_mlkit_image_labeling: any
  image_picker: ^1.1.2
  image: ^4.2.0
  file_picker: ^10.1.0
  archive: any
  syncfusion_flutter_pdf: any
  share_plus: ^10.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono.png"
  adaptive_icon_background: "#895DCA"
  adaptive_icon_foreground: "assets/icono_frente.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icono.png
