name: Crear EduAccesible.apk
on:
  workflow_dispatch:
  push:
    paths: ["flutter/**", ".github/workflows/apk.yml"]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Crear el proyecto Android y poner nuestro código
        run: |
          flutter create --org com.eduaccesible --project-name eduaccesible build_app
          cp flutter/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib && cp -r flutter/lib build_app/lib
          rm -rf build_app/test
          rm -rf build_app/assets && cp -r flutter/assets build_app/assets
          python3 - <<'PY'
          import re, glob
          m = "build_app/android/app/src/main/AndroidManifest.xml"
          s = open(m, encoding="utf-8").read()
          perm = ('<uses-permission android:name="android.permission.CAMERA"/>\n'
                  '<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  '<queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n')
          s = s.replace("<application", perm + "<application", 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="EduAccesible"', s, count=1)
          open(m, "w", encoding="utf-8").write(s)
          for g in glob.glob("build_app/android/app/build.gradle*"):
              t = open(g, encoding="utf-8").read()
              t = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", t)
              t = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", t)
              open(g, "w", encoding="utf-8").write(t)
          open("build_app/android/gradle.properties", "a").write("\nandroid.newDsl=false\n")
          # ML Kit: R8 se queja de clases de otros idiomas (chino, japonés...) que no usamos. Se le dice que las ignore.
          open("build_app/android/app/proguard-rules.pro", "w").write(
              "-dontwarn com.google.mlkit.vision.text.**\n-dontwarn com.google.mlkit.vision.**\n")
          for g in glob.glob("build_app/android/app/build.gradle*"):
              t = open(g, encoding="utf-8").read()
              if g.endswith(".kts"):
                  t = re.sub(r"(buildTypes\s*\{\s*release\s*\{)", r'\1\n            proguardFiles("proguard-rules.pro")\n            isMinifyEnabled = false\n            isShrinkResources = false', t, count=1)
              else:
                  t = re.sub(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            proguardFiles 'proguard-rules.pro'\n            minifyEnabled false\n            shrinkResources false", t, count=1)
              open(g, "w", encoding="utf-8").write(t)
          PY
      - name: Compilar el APK
        working-directory: build_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons || echo "No se pudo poner el icono; se sigue sin él"
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: EduAccesible-apk
          path: build_app/build/app/outputs/flutter-apk/*-release.apk
